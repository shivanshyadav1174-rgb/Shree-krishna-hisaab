<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shree Krishna Building Material Suppliers</title>
<style>
:root{--orange:#f47b20;--dark:#222;--bg:#fff7f0}*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--dark)}header{background:linear-gradient(120deg,#f47b20,#ff9b3d);color:white;padding:22px 16px;text-align:center;box-shadow:0 3px 12px #0002}header h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:13px}.wrap{max-width:1000px;margin:18px auto;padding:0 12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:white;border-radius:14px;padding:15px;box-shadow:0 2px 10px #0000000b}.card small{color:#777}.card strong{display:block;font-size:22px;margin-top:5px;color:#d65f08}.panel h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}label{display:block;font-size:13px;margin-bottom:5px;color:#555}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font-size:15px;background:white}button{border:0;border-radius:10px;padding:12px 16px;background:var(--orange);color:white;font-weight:bold;font-size:15px;cursor:pointer}.full{width:100%;margin-top:12px}.records{margin-top:15px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee;font-size:13px}th{background:#fff0e3;color:#8a3900}.muted{color:#777;font-size:13px}.status{margin-top:10px;font-size:14px}.due{color:#c0392b;font-weight:bold}.paid{color:#178344;font-weight:bold}@media(max-width:600px){header h1{font-size:19px}.cards{grid-template-columns:1fr 1fr}.cards .card:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}.card strong{font-size:19px}}
</style></head>
<body>
<header><h1>श्री कृष्णा बिल्डिंग मटेरियल सप्लायर्स</h1><p>दुकान का हिसाब • ग्राहक • जमा और बाकी</p></header>
<div class="wrap">
<div class="cards"><div class="card"><small>कुल बिक्री</small><strong id="sumTotal">₹0</strong></div><div class="card"><small>कुल जमा</small><strong id="sumPaid">₹0</strong></div><div class="card"><small>कुल बाकी</small><strong id="sumDue">₹0</strong></div></div>
<section class="panel"><h2>➕ नया बिल / हिसाब जोड़ें</h2><form id="entryForm"><div class="grid">
<div><label>तारीख</label><input type="date" id="date"></div>
<div><label>ग्राहक का नाम *</label><input id="name" required placeholder="ग्राहक का नाम"></div>
<div><label>मोबाइल नंबर</label><input id="mobile" inputmode="numeric" placeholder="मोबाइल नंबर"></div>
<div><label>सामान का नाम *</label><input id="item" required placeholder="सीमेंट, सरिया, गिट्टी आदि"></div>
<div><label>कुल राशि (₹) *</label><input type="number" id="total" min="0" step="0.01" required placeholder="0"></div>
<div><label>जमा राशि (₹)</label><input type="number" id="paid" min="0" step="0.01" value="0" placeholder="0"></div>
<div><label>भुगतान का तरीका</label><select id="method"><option>नकद</option><option>UPI</option><option>बैंक</option><option>उधार</option></select></div>
</div><button class="full" id="saveBtn" type="submit">हिसाब सेव करें</button><div class="status" id="status"></div></form></section>
<section class="panel records"><h2>📒 पुराने हिसाब</h2><input id="search" placeholder="ग्राहक या सामान खोजें…" style="margin-bottom:12px"><div class="tablewrap"><table><thead><tr><th>तारीख</th><th>ग्राहक</th><th>मोबाइल</th><th>सामान</th><th>कुल</th><th>जमा</th><th>बाकी</th><th>तरीका</th></tr></thead><tbody id="rows"><tr><td colspan="8">हिसाब लोड हो रहा है…</td></tr></tbody></table></div><button type="button" class="full" onclick="loadRecords()">हिसाब रिफ्रेश करें</button><p class="muted">यह हिसाब साझा Google Sheet में सेव होगा। इंटरनेट चालू होना चाहिए।</p></section>
</div>
<script>
let allRecords=[];const money=n=>'₹'+(Number(String(n).replace(/,/g,''))||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const d=document.getElementById('date');d.value=new Date().toLocaleDateString('en-CA');
function loadRecords(){document.getElementById('rows').innerHTML='<tr><td colspan="8">लोड हो रहा है…</td></tr>';google.script.run.withSuccessHandler(records=>{allRecords=records||[];render();}).withFailureHandler(e=>{document.getElementById('rows').innerHTML='<tr><td colspan="8">लोड नहीं हुआ: '+(e.message||e)+'</td></tr>';}).getRecords()}
function render(){let total=0,paid=0,due=0;allRecords.forEach(r=>{total+=Number(String(r.total).replace(/,/g,''))||0;paid+=Number(String(r.paid).replace(/,/g,''))||0;due+=Number(String(r.due).replace(/,/g,''))||0});document.getElementById('sumTotal').textContent=money(total);document.getElementById('sumPaid').textContent=money(paid);document.getElementById('sumDue').textContent=money(due);const q=document.getElementById('search').value.toLowerCase();const filtered=allRecords.filter(r=>(r.name+' '+r.mobile+' '+r.item).toLowerCase().includes(q));document.getElementById('rows').innerHTML=filtered.length?filtered.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.mobile)}</td><td>${esc(r.item)}</td><td>${money(r.total)}</td><td>${money(r.paid)}</td><td class="${Number(String(r.due).replace(/,/g,''))>0?'due':'paid'}">${money(r.due)}</td><td>${esc(r.method)}</td></tr>`).join(''):'<tr><td colspan="8">कोई हिसाब नहीं मिला।</td></tr>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('search').addEventListener('input',render);
document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();const btn=document.getElementById('saveBtn'),status=document.getElementById('status');const total=Number(document.getElementById('total').value||0),paid=Number(document.getElementById('paid').value||0);if(paid>total){status.textContent='जमा राशि कुल राशि से ज्यादा नहीं हो सकती।';return;}btn.disabled=true;btn.textContent='सेव हो रहा है…';status.textContent='';const data={date:d.value?d.value.split('-').reverse().join('-'):'',name:document.getElementById('name').value,mobile:document.getElementById('mobile').value,item:document.getElementById('item').value,total,paid,method:document.getElementById('method').value};google.script.run.withSuccessHandler(()=>{status.textContent='✅ हिसाब सेव हो गया';document.getElementById('entryForm').reset();d.value=new Date().toLocaleDateString('en-CA');document.getElementById('paid').value=0;btn.disabled=false;btn.textContent='हिसाब सेव करें';loadRecords()}).withFailureHandler(err=>{status.textContent='❌ '+(err.message||err);btn.disabled=false;btn.textContent='हिसाब सेव करें'}).addRecord(data)});
loadRecords();
</script></body></html>
